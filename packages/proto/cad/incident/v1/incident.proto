// service.incident — event-sourced aggregate. State machine per the PRD:
//
//   open → triaged → dispatched → enRoute → onScene → resolved
//                 ↘ cancelled
//
// Each RPC has its own Request/Response wrapper so individual methods can
// grow fields without forcing a v2 (buf STANDARD enforces this). The
// `Incident` payload lives inside every response. See
// .claude/skills/event-sourcing.

syntax = "proto3";

package cad.incident.v1;

import "cad/common/v1/geo.proto";

service IncidentService {
  rpc Open(OpenRequest) returns (OpenResponse);
  rpc Triage(TriageRequest) returns (TriageResponse);
  rpc Dispatch(DispatchRequest) returns (DispatchResponse);
  rpc RecordUnitArrival(RecordUnitArrivalRequest) returns (RecordUnitArrivalResponse);
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc DeclareMajor(DeclareMajorRequest) returns (DeclareMajorResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc ListOpen(ListOpenRequest) returns (ListOpenResponse);
  // The incident's own event log, oldest first — the timeline an operator
  // sees on a call. A read: no fold, no command. This makes the log part of
  // the public contract, so domain event renames are absorbed by the mapping
  // layer below rather than leaking to clients. See ADR-0006.
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse);
}

// ---- requests --------------------------------------------------------------

message OpenRequest {
  string title = 1;
  ServiceTier tier = 2;
  cad.common.v1.GeoPoint location = 3;
  string opened_by = 4;  // operatorId stub; Phase-4 auth replaces this.
}

message TriageRequest {
  string id = 1;
  Severity severity = 2;
  int64 expected_version = 3;  // optimistic concurrency.
  string triaged_by = 4;
}

message DispatchRequest {
  string id = 1;
  repeated string unit_ids = 2;
  int64 expected_version = 3;
  string dispatched_by = 4;
}

message RecordUnitArrivalRequest {
  string id = 1;
  string unit_id = 2;
  int64 expected_version = 3;
}

message ResolveRequest {
  string id = 1;
  int64 expected_version = 2;
  string resolved_by = 3;
}

message CancelRequest {
  string id = 1;
  int64 expected_version = 2;
  string cancelled_by = 3;
  string reason = 4;
}

message DeclareMajorRequest {
  string id = 1;
  int64 expected_version = 2;
  string declared_by = 3;
}

message GetRequest {
  string id = 1;
}

message GetHistoryRequest {
  string id = 1;
}

message ListOpenRequest {
  // Optional tier filter — empty/UNSPECIFIED returns every open incident.
  ServiceTier tier = 1;
  int32 limit = 2;
}

// ---- responses -------------------------------------------------------------

message OpenResponse {
  Incident incident = 1;
}

message TriageResponse {
  Incident incident = 1;
}

message DispatchResponse {
  Incident incident = 1;
}

message RecordUnitArrivalResponse {
  Incident incident = 1;
}

message ResolveResponse {
  Incident incident = 1;
}

message CancelResponse {
  Incident incident = 1;
}

message DeclareMajorResponse {
  Incident incident = 1;
}

message GetResponse {
  Incident incident = 1;
}

message ListOpenResponse {
  repeated Incident incidents = 1;
}

// ---- domain shape ----------------------------------------------------------

message GetHistoryResponse {
  repeated IncidentHistoryEntry entries = 1;  // oldest first.
}

// One entry in an incident's timeline. The detail fields are type-specific
// and only the ones that type carries are set — `severity` for a triage,
// `unit_ids` for a dispatch, and so on. Flat rather than a oneof to match the
// optional-field style `Incident` already uses.
message IncidentHistoryEntry {
  IncidentEventType type = 1;
  string occurred_at = 2;   // RFC3339.
  int64 version = 3;        // the aggregate version this event produced.
  // The operator who caused it. EMPTY for a system-driven transition: a unit
  // reporting en route or on scene moves the incident without an operator
  // touching it, and the timeline should say so rather than invent an actor.
  string actor = 4;
  Severity severity = 5;         // TRIAGED
  repeated string unit_ids = 6;  // DISPATCHED
  string unit_id = 7;            // EN_ROUTE, UNIT_ARRIVED
  string reason = 8;             // CANCELLED
}

message Incident {
  string id = 1;
  string title = 2;
  ServiceTier tier = 3;
  IncidentState state = 4;
  Severity severity = 5;
  cad.common.v1.GeoPoint location = 6;
  repeated string unit_ids = 7;
  repeated string units_on_scene = 8;
  string opened_at = 9;   // RFC3339; envelope timestamps stay strings on the wire.
  string updated_at = 10;
  int64 version = 11;
  // PR 3b: the AI classifier's latest suggestion for this incident, if any.
  // Optional — absent for incidents the classifier hasn't run on or for
  // suggestions that failed (severity=UNSPECIFIED). The gateway surfaces it
  // as a JSON `aiSuggestion` field; the console renders an "AI suggested"
  // chip; the operator's manual triage form remains authoritative.
  AiTriageSuggestion ai_suggestion = 12;
  // Sticky flag: once a commander declares the incident "major" it stays
  // major for the rest of the aggregate's life (no downgrade RPC). The
  // console renders a red MAJOR badge and the audit log carries the first
  // declaration. Optional on the wire so older payloads from a service
  // that hasn't redeployed still parse.
  bool major = 13;
}

message AiTriageSuggestion {
  Severity severity = 1;
  double confidence = 2;   // 0..1
  string rationale = 3;    // model-generated short text
  string model_version = 4; // e.g. "llama3.2:3b:v1"
  string received_at = 5;  // RFC3339; when the chip landed.
}

// ---- enums -----------------------------------------------------------------

// The aggregate's event vocabulary, mapped at the gRPC boundary so the
// domain's internal type names stay refactorable (ADR-0006).
enum IncidentEventType {
  INCIDENT_EVENT_TYPE_UNSPECIFIED = 0;
  INCIDENT_EVENT_TYPE_OPENED = 1;
  INCIDENT_EVENT_TYPE_TRIAGED = 2;
  INCIDENT_EVENT_TYPE_DISPATCHED = 3;
  INCIDENT_EVENT_TYPE_EN_ROUTE = 4;
  INCIDENT_EVENT_TYPE_UNIT_ARRIVED = 5;
  INCIDENT_EVENT_TYPE_RESOLVED = 6;
  INCIDENT_EVENT_TYPE_CANCELLED = 7;
  INCIDENT_EVENT_TYPE_MAJOR_DECLARED = 8;
}

enum ServiceTier {
  SERVICE_TIER_UNSPECIFIED = 0;
  SERVICE_TIER_POLICE = 1;
  SERVICE_TIER_MEDICAL = 2;
  SERVICE_TIER_FIRE = 3;
}

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_LOW = 1;
  SEVERITY_MEDIUM = 2;
  SEVERITY_HIGH = 3;
  SEVERITY_CRITICAL = 4;
}

enum IncidentState {
  INCIDENT_STATE_UNSPECIFIED = 0;
  INCIDENT_STATE_OPEN = 1;
  INCIDENT_STATE_TRIAGED = 2;
  INCIDENT_STATE_DISPATCHED = 3;
  INCIDENT_STATE_EN_ROUTE = 4;
  INCIDENT_STATE_ON_SCENE = 5;
  INCIDENT_STATE_RESOLVED = 6;
  INCIDENT_STATE_CANCELLED = 7;
}
