// service.auth — identity provider for the CAD system. Classical (not
// event-sourced) — operators + sessions tables. The role / permission model
// is canonical in `@cad/lib.authz`; this service issues CASL abilities
// derived from `(tier, roles, assignments)` and ships them to callers on
// the wire as `ability_json`.
//
// Each RPC has its own Request/Response wrapper so individual methods can
// grow fields without forcing a v2 (buf STANDARD enforces this).
//
// See the Notion PRD:
//   https://www.notion.so/37389ffb19fc814ca07ec9c56f982b62

syntax = "proto3";

package cad.auth.v1;

service AuthService {
  // Exchange credentials for an access + refresh token + serialised ability.
  rpc Login(LoginRequest) returns (LoginResponse);

  // Rotate an unrevoked refresh token. Reuse of a revoked refresh token
  // revokes every active session for that operator and returns UNAUTHENTICATED.
  rpc Refresh(RefreshRequest) returns (RefreshResponse);

  // Hot-path: the gateway calls this on every WebSocket open and per
  // restricted HTTP request. Verifies the JWT, looks up the unrevoked
  // session by `jti`, and returns the operator + a freshly-synthesised
  // ability. Errors map to UNAUTHENTICATED.
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);

  // Supervisor / admin-driven logout. Sets `revoked_at` on the session row;
  // a `auth.sessionRevoked` event is emitted after commit.
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);

  // Dev-only: lists seeded operators with cleartext passwords for the
  // console's dev switcher. Returns an empty list unless the service was
  // started with DEV_MODE=true. Explicitly a dev convenience — production
  // builds never call this.
  rpc ListSeededOperators(ListSeededOperatorsRequest) returns (ListSeededOperatorsResponse);
}

// ---- requests --------------------------------------------------------------

message LoginRequest {
  string email = 1;
  string password = 2;
}

message RefreshRequest {
  // The opaque refresh token returned from a prior Login/Refresh. The server
  // looks up its sha256 hash in the sessions table.
  string refresh_token = 1;
}

message ValidateTokenRequest {
  // The JWT access token. HS256, signed by the auth service.
  string access_token = 1;
}

message RevokeSessionRequest {
  string session_id = 1;
  // Audit attribution — operator id of whoever pressed the revoke button.
  string revoked_by = 2;
}

message ListSeededOperatorsRequest {}

// ---- responses -------------------------------------------------------------

// Common shape for Login + Refresh — the freshly-issued tokens, the operator
// they belong to, and the serialised ability the caller (typically the
// gateway) un-pickles to enforce.
message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  // RFC3339 — when the access token expires. Refresh expiry is implicit (the
  // server tracks it on the session row).
  string expires_at = 3;
  Operator operator = 4;
  // `JSON.stringify` of the CASL `ability.rules` array (the raw rules JSON,
  // not the full ability). The gateway calls `createMongoAbility(rules)` to
  // un-pickle. Keeping it a JSON string keeps the proto independent of the
  // CASL version on either end.
  string ability_json = 5;
  // The session row id. Useful for RevokeSession + audit logs.
  string session_id = 6;
  // Plaintext CSRF token bound to this session. The gateway sets this as
  // a (non-HttpOnly) cookie so browser JS can read it, AND echoes it in
  // the login response body so the console can prime its in-memory copy
  // on first load. The server stores only the sha256 hash on the session
  // row; mutating requests must present the matching value via the
  // `x-csrf-token` header (double-submit pattern).
  string csrf_token = 7;
}

message RefreshResponse {
  string access_token = 1;
  string refresh_token = 2;
  string expires_at = 3;
  Operator operator = 4;
  string ability_json = 5;
  string session_id = 6;
  // Rotated alongside the token pair — see LoginResponse.csrf_token.
  string csrf_token = 7;
}

message ValidateTokenResponse {
  Operator operator = 1;
  string ability_json = 2;
  string expires_at = 3;
  // sha256 of the session's CSRF token. The gateway hashes the inbound
  // `x-csrf-token` header / `cad_csrf` cookie and compares to this
  // value. We never put the plaintext on the wire here — it lives only
  // in the cookie the gateway issued at login time.
  string csrf_hash = 4;
  // The session id this token belongs to. Useful for audit attribution
  // and for the gateway to re-prime the CSRF cookie if it ever drifts.
  string session_id = 5;
}

message RevokeSessionResponse {}

message ListSeededOperatorsResponse {
  repeated SeededOperator seeded_operators = 1;
}

// ---- domain shape ----------------------------------------------------------

message Operator {
  string id = 1;
  string email = 2;
  string display_name = 3;
  ServiceTier tier = 4;
  repeated Role roles = 5;
  bool disabled = 6;
  // Resource-service unit ids the operator crews. Today only the `responder`
  // role consumes this — `defineAbilitiesFor` in `@cad/lib.authz` reads it
  // to scope the `setUnitStatus Unit { id }` rule to the operator's own
  // unit(s). Empty for every other role (and for responders the seed hasn't
  // bound to a unit yet). Forward-compatible: callers that don't know about
  // this field continue to work unchanged.
  repeated string assigned_unit_ids = 7;
}

// Dev-only convenience payload. `password` is cleartext — explicitly a dev
// pattern (deterministic seed, never used in production builds). The
// console's dev switcher renders this to let an operator log in as any
// seeded persona.
message SeededOperator {
  string email = 1;
  string password = 2;
  string display_name = 3;
  ServiceTier tier = 4;
  repeated Role roles = 5;
}

// ---- enums -----------------------------------------------------------------

// Mirrors `@cad/lib.authz`'s SERVICE_TIERS. Locale-agnostic — display labels
// (Ambulance / EMS / Paramedic) come from the i18n locale pack, not here.
enum ServiceTier {
  SERVICE_TIER_UNSPECIFIED = 0;
  SERVICE_TIER_POLICE = 1;
  SERVICE_TIER_MEDICAL = 2;
  SERVICE_TIER_FIRE = 3;
}

// Mirrors `@cad/lib.authz`'s ROLES. Job functions are canonical; localised
// labels (Call Handler / Call Taker, Dispatcher / Telecommunicator, …) are
// presentation only — see the PRD's Localisation section.
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_CALL_HANDLER = 1;
  ROLE_DISPATCHER = 2;
  ROLE_SUPERVISOR = 3;
  ROLE_COMMANDER = 4;
  ROLE_RESPONDER = 5;
  ROLE_OBSERVER = 6;
  ROLE_ADMIN = 7;
}
