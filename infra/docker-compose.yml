# Full local stack. The dep services (Postgres, Redis, NATS, Jaeger) come
# in via the include below. Service entries are pasted from each
# `services/<name>/compose.fragment.yml` (the new-service generator emits
# the fragment when the service is created).
name: cad

include:
  - path: docker-compose.deps.yml

services:
  service-gateway:
    build:
      context: ..
      dockerfile: services/service.gateway/Dockerfile
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: "5000"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      INCIDENT_GRPC_URL: service-incident:5021
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  service-auth:
    build:
      context: ..
      dockerfile: services/service.auth/Dockerfile
    ports:
      - "5010:5010"
    environment:
      NODE_ENV: development
      PORT: "5010"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      DATABASE_URL: postgres://cad:cad@postgres:5432/cad
      DB_SCHEMA: auth
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  service-incident:
    build:
      context: ..
      dockerfile: services/service.incident/Dockerfile
    ports:
      - "5020:5020"   # HTTP /health
      - "5021:5021"   # gRPC IncidentService
    environment:
      NODE_ENV: development
      PORT: "5020"
      GRPC_PORT: "5021"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      DATABASE_URL: postgres://cad:cad@postgres:5432/cad
      DB_SCHEMA: incident
      MIGRATE_ON_BOOT: "true"
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  service-dispatch:
