# Full local stack. Includes the dep stack via `extends`/`include` so a single
# `docker compose -f infra/docker-compose.yml up` runs everything. Service
# entries are appended here by `pnpm new-service` (the generator prints the
# fragment to paste in).
name: cad

include:
  - path: docker-compose.deps.yml

