# Full local stack. The dep services (Postgres, Redis, NATS, Jaeger) come
# in via the include below. Service entries are pasted from each
# `services/<name>/compose.fragment.yml` (the new-service generator emits
# the fragment when the service is created).
name: cad

include:
  - path: docker-compose.deps.yml

services:
  service-gateway:
    build:
      context: ..
      dockerfile: services/service.gateway/Dockerfile
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: "5000"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      INCIDENT_GRPC_URL: service-incident:5021
      RESOURCE_GRPC_URL: service-resource:5041
      DISPATCH_GRPC_URL: service-dispatch:5031
      AUTH_GRPC_URL: service-auth:5011
      AUDIT_GRPC_URL: service-audit:5091
      TRIAGE_GRPC_URL: service-triage:5081
      # Demo-friendly default for now — unauthenticated requests get a
      # synthesised supervisor session so the existing smokes keep working.
      # Production sets this false; the gateway then requires a real
      # access token issued by service.auth. See services/service.gateway/README.md.
      DEV_AUTH_BYPASS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  service-auth:
    build:
      context: ..
      dockerfile: services/service.auth/Dockerfile
    ports:
      - "5010:5010"   # HTTP /health + dev-only /dev/* routes
      - "5011:5011"   # gRPC AuthService
    environment:
      NODE_ENV: development
      PORT: "5010"
      GRPC_PORT: "5011"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      DATABASE_URL: postgres://cad:cad@postgres:5432/cad
      DB_SCHEMA: auth
      MIGRATE_ON_BOOT: "true"
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      # Dev-only: gates `ListSeededOperators` + the `/dev/*` HTTP routes
      # the seed script uses. Production deployments set this to false (or
      # omit it). See services/service.auth/README.md.
      DEV_MODE: "true"
      # Placeholder HS256 secret. Production injects a real one.
      JWT_SECRET: dev-only-not-a-real-secret
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  service-incident:
    build:
      context: ..
      dockerfile: services/service.incident/Dockerfile
    ports:
      - "5020:5020"   # HTTP /health
      - "5021:5021"   # gRPC IncidentService
    environment:
      NODE_ENV: development
      PORT: "5020"
      GRPC_PORT: "5021"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      DATABASE_URL: postgres://cad:cad@postgres:5432/cad
      DB_SCHEMA: incident
      MIGRATE_ON_BOOT: "true"
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Stateless recommender — no Postgres / NATS / Redis. Its only deps are gRPC
  # out to service-incident + service-resource, dialled lazily; no compose-level
  # depends_on for those (neither has a healthcheck declared, and gateway
  # follows the same lazy-dial pattern). See compose.fragment.yml.
  service-dispatch:
    build:
      context: ..
      dockerfile: services/service.dispatch/Dockerfile
    ports:
      - "5030:5030"   # HTTP /health
      - "5031:5031"   # gRPC DispatchService
    environment:
      NODE_ENV: development
      PORT: "5030"
      GRPC_PORT: "5031"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      INCIDENT_GRPC_URL: service-incident:5021
      RESOURCE_GRPC_URL: service-resource:5041
      GEO_GRPC_URL: service-geo:5051
    restart: unless-stopped

  service-resource:
    build:
      context: ..
      dockerfile: services/service.resource/Dockerfile
    ports:
      - "5040:5040"   # HTTP /health
      - "5041:5041"   # gRPC ResourceService
    environment:
      NODE_ENV: development
      PORT: "5040"
      GRPC_PORT: "5041"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      DATABASE_URL: postgres://cad:cad@postgres:5432/cad
      DB_SCHEMA: resource
      MIGRATE_ON_BOOT: "true"
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  service-geo:
    build:
      context: ..
      dockerfile: services/service.geo/Dockerfile
    ports:
      - "5050:5050"   # HTTP /health
      - "5051:5051"   # gRPC GeoService
    environment:
      NODE_ENV: development
      PORT: "5050"
      GRPC_PORT: "5051"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      DATABASE_URL: postgres://cad:cad@postgres:5432/cad
      DB_SCHEMA: geo
      MIGRATE_ON_BOOT: "true"
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  service-notification:
    build:
      context: ..
      dockerfile: services/service.notification/Dockerfile
    ports:
      - "5065:5065"
    environment:
      NODE_ENV: development
      PORT: "5065"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  service-audit:
    build:
      context: ..
      dockerfile: services/service.audit/Dockerfile
    ports:
      - "5090:5090"   # HTTP /health
      - "5091:5091"   # gRPC AuditQueryService
    environment:
      NODE_ENV: development
      PORT: "5090"
      GRPC_PORT: "5091"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      DATABASE_URL: postgres://cad:cad@postgres:5432/cad
      DB_SCHEMA: audit
      MIGRATE_ON_BOOT: "true"
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  service-triage:
    build:
      context: ..
      dockerfile: services/triage/Dockerfile
    ports:
      - "5080:5080"   # HTTP /health + /classify (local-dev convenience)
      - "5081:5081"   # gRPC TriageService
    environment:
      PORT: "5080"
      GRPC_PORT: "5081"
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    # PR 3a's classifier is a stub; it doesn't call Ollama. The depends_on is
    # already wired so PR 3b only needs to swap the classifier impl — no
    # compose churn. Ollama's healthcheck is `ollama list || exit 1`, which
    # passes as soon as the daemon is up (no models required for 3a).
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  # Local LLM runtime for service.triage. PR 3a doesn't pre-pull a model
  # (the stub classifier doesn't need one); PR 3b will add an init step
  # that runs `ollama pull ${OLLAMA_MODEL}` before the service comes up.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - cad-ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  cad-ollama:
