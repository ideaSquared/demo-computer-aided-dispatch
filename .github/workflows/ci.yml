name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - claude/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      bootstrapped: ${{ steps.check.outputs.bootstrapped }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Is the workspace bootstrapped?
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
            echo "pnpm-lock.yaml found — running the full pipeline."
          else
            echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
            echo "No pnpm-lock.yaml — PR 2 hasn't landed yet. Downstream jobs will be skipped."
          fi

  install:
    name: install
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.bootstrapped == 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: [preflight, install]
    if: needs.preflight.outputs.bootstrapped == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-typecheck-${{ github.sha }}
          restore-keys: |
            turbo-typecheck-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: [preflight, install]
    if: needs.preflight.outputs.bootstrapped == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-lint-${{ github.sha }}
          restore-keys: |
            turbo-lint-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [preflight, install]
    if: needs.preflight.outputs.bootstrapped == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-test-${{ github.sha }}
          restore-keys: |
            turbo-test-
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --reporter=junit --outputFile=junit.xml || pnpm test
      - name: Upload test report
        if: always() && hashFiles('**/junit.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: "**/junit.xml"

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [preflight, typecheck, lint]
    if: needs.preflight.outputs.bootstrapped == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-build-${{ github.sha }}
          restore-keys: |
            turbo-build-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install commitlint
        run: |
          npm install --no-save \
            @commitlint/cli@^19 \
            @commitlint/config-conventional@^19
      - name: Lint PR commits
        run: |
          npx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose \
            --config commitlint.config.ts

  labeler:
    name: labeler
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v6
        with:
          configuration-path: .github/labeler.yml
