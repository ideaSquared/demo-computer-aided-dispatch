name: docker-build

on:
  pull_request:
    paths:
      - "services/**"
      - "apps/**"
      - "infra/Dockerfile*"
      - "infra/docker-compose*.yml"
  push:
    branches:
      - main
    paths:
      - "services/**"
      - "apps/**"
      - "infra/Dockerfile*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: discover build targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      has_targets: ${{ steps.set.outputs.has_targets }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        name: Build matrix from services/* and apps/*
        run: |
          targets=()
          for d in services/* apps/*; do
            if [ -f "$d/Dockerfile" ]; then
              targets+=("\"$d\"")
            fi
          done
          if [ ${#targets[@]} -eq 0 ]; then
            echo "matrix={\"target\":[]}" >> "$GITHUB_OUTPUT"
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
          else
            joined=$(IFS=,; echo "${targets[*]}")
            echo "matrix={\"target\":[$joined]}" >> "$GITHUB_OUTPUT"
            echo "has_targets=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build ${{ matrix.target }}
    needs: discover
    if: needs.discover.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.target }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.target }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.target }}:latest
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
