name: integration

on:
  pull_request:
    paths:
      - "services/**"
      - "packages/events/**"
      - "packages/proto/**"
      - "packages/db/**"
      - "infra/docker-compose*.yml"
      - "tools/scripts/smoke.ts"
      - ".dockerignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build images
        run: docker compose -f infra/docker-compose.yml build
      - name: Boot the stack
        run: docker compose -f infra/docker-compose.yml up -d
      - name: Wait for deps
        run: |
          for i in {1..60}; do
            if docker compose -f infra/docker-compose.yml ps --status running | grep -q jaeger && \
               docker compose -f infra/docker-compose.yml ps --status running | grep -q postgres; then
              echo "Stack up."
              exit 0
            fi
            sleep 2
          done
          echo "Stack failed to come up." >&2
          docker compose -f infra/docker-compose.yml logs
          exit 1
      - name: Container status before smoke
        run: |
          echo '::group::compose ps'
          docker compose -f infra/docker-compose.yml ps -a
          echo '::endgroup::'
      - name: Smoke
        run: pnpm smoke
      - name: Dump container logs on failure
        if: failure()
        run: |
          echo '::group::compose ps --format json'
          docker compose -f infra/docker-compose.yml ps -a --format json || true
          echo '::endgroup::'
          for svc in service-gateway service-auth service-incident service-dispatch service-resource service-geo service-notification service-audit service-triage postgres redis nats jaeger; do
            echo "::group::logs $svc"
            docker compose -f infra/docker-compose.yml logs --no-color --tail=100 "$svc" || true
            echo '::endgroup::'
          done
      - name: Save full logs as artifact
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color > compose-logs.txt
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs
          path: compose-logs.txt
      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  dev-stack:
    name: dev-stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Build + boot the Docker DEV stack (services run via tsx watch in
      # containers). We use `up -d` rather than `watch` because watch is
      # interactive/long-running; `up` still validates the dev image builds
      # and every service boots and serves under tsx.
      - name: Build dev images
        run: docker compose -f infra/docker-compose.dev.yml build
      - name: Boot the dev stack
        run: docker compose -f infra/docker-compose.dev.yml up -d
      - name: Wait for deps
        run: |
          for i in {1..60}; do
            if docker compose -f infra/docker-compose.dev.yml ps --status running | grep -q jaeger && \
               docker compose -f infra/docker-compose.dev.yml ps --status running | grep -q postgres; then
              echo "Dev stack up."
              exit 0
            fi
            sleep 2
          done
          echo "Dev stack failed to come up." >&2
          docker compose -f infra/docker-compose.dev.yml logs
          exit 1
      - name: Smoke
        run: pnpm smoke
      - name: Dump container logs on failure
        if: failure()
        run: |
          for svc in service-gateway service-auth service-incident service-dispatch service-resource service-geo service-notification service-audit service-triage postgres redis nats jaeger; do
            echo "::group::logs $svc"
            docker compose -f infra/docker-compose.dev.yml logs --no-color --tail=100 "$svc" || true
            echo '::endgroup::'
          done
      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.dev.yml down -v
