name: integration

on:
  pull_request:
    paths:
      - "services/**"
      - "apps/**"
      - "packages/events/**"
      - "packages/proto/**"
      - "packages/db/**"
      - "packages/redis/**"
      - "infra/**"
      - "tools/scripts/smoke.ts"
      - "tools/scripts/ws-smoke.ts"
      - "tools/scripts/grpc-smoke.ts"
      - "tools/scripts/incident-ws-smoke.ts"
      - "tools/scripts/incident-http-smoke.ts"
      - "tools/scripts/resource-http-smoke.ts"
      - "tools/scripts/dispatch-loop-smoke.ts"
      - "tools/scripts/recommend-smoke.ts"
      - "tools/scripts/geo-smoke.ts"
      - "tools/scripts/lifecycle-smoke.ts"
      - "tools/scripts/auth-smoke.ts"
      - "tools/scripts/enforce-smoke.ts"
      - "tools/scripts/audit-smoke.ts"
      - "tools/scripts/triage-stub-smoke.ts"
      - ".dockerignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build images
        run: docker compose -f infra/docker-compose.yml build
      - name: Boot the stack
        run: docker compose -f infra/docker-compose.yml up -d
      - name: Wait for deps
        run: |
          for i in {1..60}; do
            if docker compose -f infra/docker-compose.yml ps --status running | grep -q jaeger && \
               docker compose -f infra/docker-compose.yml ps --status running | grep -q postgres; then
              echo "Stack up."
              exit 0
            fi
            sleep 2
          done
          echo "Stack failed to come up." >&2
          docker compose -f infra/docker-compose.yml logs
          exit 1
      - name: Container status before smoke
        run: |
          echo '::group::compose ps'
          docker compose -f infra/docker-compose.yml ps -a
          echo '::endgroup::'
      - name: Smoke
        run: pnpm smoke
      # The gRPC smoke runs on the host (tsx) and imports @cad/proto, whose
      # exports.import points at dist/index.js. The Docker images build their
      # own bundles, but the host workspace doesn't unless we ask for it.
      - name: Build proto bundle for host smoke
        run: pnpm --filter @cad/proto build
      - name: gRPC smoke (incident)
        run: pnpm smoke:grpc
      # Incident event spine: NATS → notification → Redis → gateway → ws.
      - name: Incident WS smoke
        run: pnpm smoke:incident-ws
      # Phase 2 command path: http → gateway → incident gRPC → Postgres.
      - name: Incident HTTP smoke (gateway)
        run: pnpm smoke:incident-http
      # Phase 3 command path: http → gateway → resource gRPC → Postgres.
      - name: Resource HTTP smoke (gateway)
        run: pnpm smoke:resource-http
      # Phase 3 reaction loop: dispatch an incident to a registered unit and
      # assert the unit flips to 'dispatched' via the NATS subscriber.
      - name: Dispatch→unit-status loop smoke
        run: pnpm smoke:dispatch-loop
      # Phase 3 recommender: rank available units by distance to an incident
      # via the dispatch service (incident Get + resource ListUnits → ranking).
      - name: Recommend-units smoke (gateway)
        run: pnpm smoke:recommend
      # Phase 5 geo: PostGIS-backed NearestK end-to-end. Registers two
      # fire units at known coords, opens a fire incident, and asserts
      # the recommender (now backed by geo.NearestK) ranks the near unit
      # first with realistic distances.
      - name: Geo NearestK smoke (gateway → dispatch → geo)
        run: pnpm smoke:geo
      # Phase 3 lifecycle loop: an assigned unit's enRoute / onScene reports
      # drive the incident to enRoute / onScene via the NATS subscriber.
      - name: Unit-movement→incident-lifecycle smoke
        run: pnpm smoke:lifecycle
      # Phase 4 identity: upsert an operator → login → validate access
      # token → revoke session → validate again (asserts UNAUTHENTICATED).
      # Drives the auth service's dev-only HTTP wrappers, which call the
      # same core as the gRPC AuthService.
      - name: Auth smoke
        run: pnpm smoke:auth
      # Phase 4 enforcement: call_handler is denied dispatch (headline
      # gate), a fire dispatcher succeeds, a police dispatcher is denied
      # cross-tier, and an observer can list but not triage.
      - name: Enforcement smoke (gateway CASL gate)
        run: pnpm smoke:enforce
      # The console's login flow lives behind the gateway's auth proxy.
      # Drives the same surface the browser uses: seeded list → login →
      # /me → refresh → logout → 401-after-revoke.
      - name: Dev-login smoke (gateway auth proxy)
        run: pnpm smoke:dev-login
      # Phase 5 audit consumer: a call_handler is denied dispatch, the
      # gateway emits audit.actionTaken{denied}, service.audit appends it
      # to its event store, and admin reads it back via the gateway
      # query proxy.
      - name: Audit smoke (gateway → audit query)
        run: pnpm smoke:audit
      # Phase 5 PR 3a: polyglot triage seam. Dispatcher logs in, posts to
      # /api/triage/classify, gateway proxies to the Python gRPC service,
      # the stub responds. PR 3b will swap the stub for the Ollama call
      # and this smoke's assertions will then fail (canned shape changes).
      - name: Triage-stub smoke (gateway → triage gRPC stub)
        run: pnpm smoke:triage-stub
      - name: Dump container logs on failure
        if: failure()
        run: |
          echo '::group::compose ps --format json'
          docker compose -f infra/docker-compose.yml ps -a --format json || true
          echo '::endgroup::'
          for svc in service-gateway service-auth service-incident service-dispatch service-resource service-geo service-notification service-audit service-triage app-console postgres redis nats jaeger; do
            echo "::group::logs $svc"
            docker compose -f infra/docker-compose.yml logs --no-color --tail=100 "$svc" || true
            echo '::endgroup::'
          done
      - name: Save full logs as artifact
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color > compose-logs.txt
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs
          path: compose-logs.txt
      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  dev-stack:
    name: dev-stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Build + boot the Docker DEV stack (services run via tsx watch in
      # containers). We use `up -d` rather than `watch` because watch is
      # interactive/long-running; `up` still validates the dev image builds
      # and every service boots and serves under tsx.
      - name: Build dev images
        run: docker compose -f infra/docker-compose.dev.yml build
      - name: Boot the dev stack
        run: docker compose -f infra/docker-compose.dev.yml up -d
      - name: Wait for deps
        run: |
          for i in {1..60}; do
            if docker compose -f infra/docker-compose.dev.yml ps --status running | grep -q jaeger && \
               docker compose -f infra/docker-compose.dev.yml ps --status running | grep -q postgres; then
              echo "Dev stack up."
              exit 0
            fi
            sleep 2
          done
          echo "Dev stack failed to come up." >&2
          docker compose -f infra/docker-compose.dev.yml logs
          exit 1
      - name: Smoke
        run: pnpm smoke
      # Phase 1 end-to-end: WS → NATS → notification → Redis → WS.
      # Two clients, B receives A's setStatus event via the spine.
      - name: WebSocket smoke
        run: pnpm smoke:ws
      # Phase 2 end-to-end: gRPC client → incident-service → Postgres tx,
      # then incident.opened → NATS subscriber. Asserts the full lifecycle
      # + that the NATS publish-after-commit path actually fires.
      # @cad/proto must be bundled on the host for tsx to resolve its
      # `import` export condition (see same step in the smoke job).
      - name: Build proto bundle for host smoke
        run: pnpm --filter @cad/proto build
      - name: gRPC smoke (incident)
        run: pnpm smoke:grpc
      # Incident event spine: NATS → notification → Redis → gateway → ws.
      - name: Incident WS smoke
        run: pnpm smoke:incident-ws
      # Phase 2 command path: http → gateway → incident gRPC → Postgres.
      - name: Incident HTTP smoke (gateway)
        run: pnpm smoke:incident-http
      # Phase 3 command path: http → gateway → resource gRPC → Postgres.
      - name: Resource HTTP smoke (gateway)
        run: pnpm smoke:resource-http
      # Phase 3 reaction loop: dispatch an incident to a registered unit and
      # assert the unit flips to 'dispatched' via the NATS subscriber.
      - name: Dispatch→unit-status loop smoke
        run: pnpm smoke:dispatch-loop
      # Phase 3 recommender: rank available units by distance to an incident
      # via the dispatch service (incident Get + resource ListUnits → ranking).
      - name: Recommend-units smoke (gateway)
        run: pnpm smoke:recommend
      # Phase 5 geo: PostGIS-backed NearestK end-to-end. Registers two
      # fire units at known coords, opens a fire incident, and asserts
      # the recommender (now backed by geo.NearestK) ranks the near unit
      # first with realistic distances.
      - name: Geo NearestK smoke (gateway → dispatch → geo)
        run: pnpm smoke:geo
      # Phase 3 lifecycle loop: an assigned unit's enRoute / onScene reports
      # drive the incident to enRoute / onScene via the NATS subscriber.
      - name: Unit-movement→incident-lifecycle smoke
        run: pnpm smoke:lifecycle
      # Phase 4 identity: upsert an operator → login → validate access
      # token → revoke session → validate again (asserts UNAUTHENTICATED).
      # Drives the auth service's dev-only HTTP wrappers, which call the
      # same core as the gRPC AuthService.
      - name: Auth smoke
        run: pnpm smoke:auth
      # Phase 4 enforcement: dispatch gate, tier scope, observer read-only.
      - name: Enforcement smoke (gateway CASL gate)
        run: pnpm smoke:enforce
      # The console's login flow lives behind the gateway's auth proxy.
      # Drives the same surface the browser uses: seeded list → login →
      # /me → refresh → logout → 401-after-revoke.
      - name: Dev-login smoke (gateway auth proxy)
        run: pnpm smoke:dev-login
      # Phase 5 audit consumer: a call_handler is denied dispatch, the
      # gateway emits audit.actionTaken{denied}, service.audit appends it
      # to its event store, and admin reads it back via the gateway
      # query proxy.
      - name: Audit smoke (gateway → audit query)
        run: pnpm smoke:audit
      # Phase 5 PR 3a: polyglot triage seam. Dispatcher logs in, posts to
      # /api/triage/classify, gateway proxies to the Python gRPC service,
      # the stub responds. PR 3b will swap the stub for the Ollama call
      # and this smoke's assertions will then fail (canned shape changes).
      - name: Triage-stub smoke (gateway → triage gRPC stub)
        run: pnpm smoke:triage-stub
      - name: Dump container logs on failure
        if: failure()
        run: |
          for svc in service-gateway service-auth service-incident service-dispatch service-resource service-geo service-notification service-audit service-triage app-console postgres redis nats jaeger; do
            echo "::group::logs $svc"
            docker compose -f infra/docker-compose.dev.yml logs --no-color --tail=100 "$svc" || true
            echo '::endgroup::'
          done
      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.dev.yml down -v
