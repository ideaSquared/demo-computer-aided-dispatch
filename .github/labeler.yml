apps:
  - changed-files:
      - any-glob-to-any-file:
          - "apps/**"

services:
  - changed-files:
      - any-glob-to-any-file:
          - "services/**"

packages:
  - changed-files:
      - any-glob-to-any-file:
          - "packages/**"

infra:
  - changed-files:
      - any-glob-to-any-file:
          - "infra/**"
          - "**/Dockerfile*"
          - "**/compose*.yml"

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "**/*.md"
          - "**/README.md"

claude-config:
