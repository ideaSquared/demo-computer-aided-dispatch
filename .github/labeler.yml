      - any-glob-to-any-file:
          - ".claude/**"
          - "CLAUDE.md"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"

generators:
  - changed-files:
      - any-glob-to-any-file:
          - "tools/scripts/plop/**"
          - ".claude/skills/new-*/**"

triage:
  - changed-files:
      - any-glob-to-any-file:
          - "services/triage/**"
