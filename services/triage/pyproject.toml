[project]
name = "cad-service-triage"
version = "0.0.0"
description = "AI severity classification via a local LLM. The single Python service in the CAD repo."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.136.3",
  "uvicorn[standard]>=0.48.0",
  "pydantic>=2.13.4",
  "httpx>=0.28.1",
  "grpcio>=1.68.0",
  "protobuf>=5.28.0",
  "nats-py>=2.9.0",
  "opentelemetry-distro[otlp]>=0.63b1",
  "opentelemetry-instrumentation-grpc>=0.63b1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=1.4.0",
  "grpcio-tools>=1.68.0",
  "ruff>=0.15.15",
  "mypy>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
