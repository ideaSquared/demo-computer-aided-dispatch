# Paste this entry under `services:` in infra/docker-compose.yml.

service-auth:
  build:
    context: ..
    dockerfile: services/service.auth/Dockerfile
  ports:
    - "5010:5010"
  environment:
    NODE_ENV: development
    PORT: "5010"
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    DATABASE_URL: postgres://cad:cad@postgres:5432/cad
    DB_SCHEMA: auth
    NATS_URL: nats://nats:4222
    REDIS_URL: redis://redis:6379
  depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
  restart: unless-stopped
