# Paste this entry under `services:` in infra/docker-compose.yml.

service-audit:
  build:
    context: ..
    dockerfile: services/service.audit/Dockerfile
  ports:
    - "5090:5090"   # HTTP /health
    - "5091:5091"   # gRPC AuditQueryService
  environment:
    NODE_ENV: development
    PORT: "5090"
    GRPC_PORT: "5091"
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    DATABASE_URL: postgres://cad:cad@postgres:5432/cad
    DB_SCHEMA: audit
    MIGRATE_ON_BOOT: "true"
    NATS_URL: nats://nats:4222
    REDIS_URL: redis://redis:6379
  depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
  restart: unless-stopped
