# Paste this entry under `services:` in infra/docker-compose.yml.

service-incident:
  build:
    context: ..
    dockerfile: services/service.incident/Dockerfile
  ports:
    - "5020:5020"   # HTTP /health
    - "5021:5021"   # gRPC IncidentService
  environment:
    NODE_ENV: development
    PORT: "5020"
    GRPC_PORT: "5021"
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    DATABASE_URL: postgres://cad:cad@postgres:5432/cad
    DB_SCHEMA: incident
    MIGRATE_ON_BOOT: "true"
    NATS_URL: nats://nats:4222
    REDIS_URL: redis://redis:6379
  depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
  restart: unless-stopped
