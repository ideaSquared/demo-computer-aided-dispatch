# Paste this entry under `services:` in infra/docker-compose.yml.

service-dispatch:
  build:
    context: ..
    dockerfile: services/service.dispatch/Dockerfile
  ports:
    - "5030:5030"   # HTTP /health
    - "5031:5031"   # gRPC DispatchService
  environment:
    NODE_ENV: development
    PORT: "5030"
    GRPC_PORT: "5031"
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    NATS_URL: nats://nats:4222
    REDIS_URL: redis://redis:6379
    INCIDENT_GRPC_URL: service-incident:5021
    RESOURCE_GRPC_URL: service-resource:5041
  depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
  restart: unless-stopped
