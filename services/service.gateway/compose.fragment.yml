# Paste this entry under `services:` in infra/docker-compose.yml.

service-gateway:
  build:
    context: ..
    dockerfile: services/service.gateway/Dockerfile
  ports:
    - "5000:5000"
  environment:
    NODE_ENV: development
    PORT: "5000"
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    NATS_URL: nats://nats:4222
    REDIS_URL: redis://redis:6379
    INCIDENT_GRPC_URL: service-incident:5021
    RESOURCE_GRPC_URL: service-resource:5041
    DISPATCH_GRPC_URL: service-dispatch:5031
    AUTH_GRPC_URL: service-auth:5011
    DEV_AUTH_BYPASS: "true"
  depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
  restart: unless-stopped
