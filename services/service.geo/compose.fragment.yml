# Paste this entry under `services:` in infra/docker-compose.yml.

service-geo:
  build:
    context: ..
    dockerfile: services/service.geo/Dockerfile
  ports:
    - "5050:5050"   # HTTP /health
    - "5051:5051"   # gRPC GeoService
  environment:
    NODE_ENV: development
    PORT: "5050"
    GRPC_PORT: "5051"
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    DATABASE_URL: postgres://cad:cad@postgres:5432/cad
    DB_SCHEMA: geo
    MIGRATE_ON_BOOT: "true"
    NATS_URL: nats://nats:4222
    REDIS_URL: redis://redis:6379
  depends_on:
    postgres:
      condition: service_healthy
    nats:
      condition: service_healthy
  restart: unless-stopped
